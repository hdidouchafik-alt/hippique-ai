<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drivers - Hippique AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               background: #0f172a; color: #e2e8f0; padding: 20px; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #38bdf8; margin-bottom: 8px; font-size: 28px; }
        .subtitle { color: #94a3b8; margin-bottom: 30px; font-size: 14px; }
        .nav { margin-bottom: 30px; display: flex; gap: 12px; flex-wrap: wrap; }
        .nav a { color: #38bdf8; text-decoration: none; padding: 8px 16px;
                 border: 1px solid #334155; border-radius: 6px; font-size: 14px; }
        .nav a:hover { background: #1e293b; border-color: #38bdf8; }
        .nav a.active { background: #38bdf8; color: #0f172a; font-weight: 600; }
        .section { background: #1e293b; border-radius: 10px; padding: 24px;
                   margin-bottom: 24px; border: 1px solid #334155; }
        .section h2 { color: #38bdf8; font-size: 20px; margin-bottom: 16px;
                      padding-bottom: 10px; border-bottom: 1px solid #334155; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .stat-card { background: #0f172a; border-radius: 8px; padding: 16px;
                     border: 1px solid #334155; text-align: center; }
        .stat-value { font-size: 28px; font-weight: 700; color: #38bdf8; }
        .stat-label { font-size: 12px; color: #94a3b8; text-transform: uppercase;
                      letter-spacing: 1px; margin-top: 4px; }
        .search-box { margin-bottom: 16px; }
        .search-box input { background: #0f172a; color: #e2e8f0; border: 1px solid #334155;
                            padding: 10px 14px; border-radius: 6px; font-size: 14px;
                            width: 100%; max-width: 400px; }
        .search-box input:focus { outline: none; border-color: #38bdf8; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; padding: 12px 10px; color: #94a3b8;
             border-bottom: 1px solid #334155; font-size: 12px;
             text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; }
        th:hover { color: #38bdf8; }
        td { padding: 12px 10px; border-bottom: 1px solid #0f172a; }
        tr:hover td { background: #0f172a; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 4px;
                 font-size: 11px; font-weight: 600; }
        .badge-green { background: #166534; color: #86efac; }
        .badge-yellow { background: #78350f; color: #fcd34d; }
        .badge-red { background: #7f1d1d; color: #fca5a5; }
        .rank-1 { color: #fbbf24; font-weight: 700; }
        .rank-2 { color: #c0c0c0; font-weight: 700; }
        .rank-3 { color: #cd7f32; font-weight: 700; }
        .empty { text-align: center; padding: 30px; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏇 Drivers & Jockeys</h1>
        <p class="subtitle">Statistiques de performance basées sur les courses terminées</p>

        <div class="nav">
    <a href="/">🏠 Accueil</a>
    <a href="/reunions">📅 Réunions</a>
    <a href="/pronostics">📊 Pronostics</a>
    <a href="/paris">💰 Paris</a>
    <a href="/drivers" class="active">🏇 Drivers</a>
    <a href="/learning">🎓 Learning</a>
    <a href="/docs" target="_blank">📚 API</a>
</div>

        <div class="section">
            <h2>📊 Statistiques globales</h2>
            <div class="grid" id="stats-globales">
                <div class="stat-card">
                    <div class="stat-value" id="stat-total">—</div>
                    <div class="stat-label">Drivers en base</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-courses">—</div>
                    <div class="stat-label">Courses cumulées</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-victoires">—</div>
                    <div class="stat-label">Victoires cumulées</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-taux">—</div>
                    <div class="stat-label">Taux victoire moyen</div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>📋 Classement complet</h2>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 Rechercher un driver...">
            </div>
            <div id="table-container">
                <div class="empty">Chargement...</div>
            </div>
        </div>
    </div>

    <script>
        let tousLesDrivers = [];
        let triColonne = 'victoires';
        let triAsc = false;

        function badgeTaux(taux) {
            if (taux >= 30) return 'badge-green';
            if (taux >= 15) return 'badge-yellow';
            return 'badge-red';
        }

        function afficherTable() {
            const filtre = document.getElementById('search-input').value.toLowerCase();
            let drivers = tousLesDrivers.filter(d =>
                !filtre || (d.driver || '').toLowerCase().includes(filtre)
            );

            drivers.sort((a, b) => {
                const va = a[triColonne] || 0;
                const vb = b[triColonne] || 0;
                return triAsc ? va - vb : vb - va;
            });

            if (drivers.length === 0) {
                document.getElementById('table-container').innerHTML = '<div class="empty">Aucun driver trouvé.</div>';
                return;
            }

            let html = '<table><thead><tr>';
            html += '<th>#</th>';
            html += '<th data-col="driver">Driver</th>';
            html += '<th data-col="courses">Courses</th>';
            html += '<th data-col="victoires">Victoires</th>';
            html += '<th data-col="top5">Top 5</th>';
            html += '<th data-col="taux">Taux victoire</th>';
            html += '<th data-col="taux_top5">Taux top 5</th>';
            html += '</tr></thead><tbody>';

            drivers.forEach((d, i) => {
                const taux = d.courses > 0 ? (d.victoires / d.courses) * 100 : 0;
                const tauxTop5 = d.courses > 0 ? (d.top5 / d.courses) * 100 : 0;
                let rankCls = '';
                if (i === 0) rankCls = 'rank-1';
                else if (i === 1) rankCls = 'rank-2';
                else if (i === 2) rankCls = 'rank-3';

                html += `<tr>
                    <td class="${rankCls}">${i + 1}</td>
                    <td><strong>${d.driver}</strong></td>
                    <td>${d.courses}</td>
                    <td>${d.victoires}</td>
                    <td>${d.top5}</td>
                    <td><span class="badge ${badgeTaux(taux)}">${taux.toFixed(1)}%</span></td>
                    <td><span class="badge ${badgeTaux(tauxTop5)}">${tauxTop5.toFixed(1)}%</span></td>
                </tr>`;
            });

            html += '</tbody></table>';
            document.getElementById('table-container').innerHTML = html;

            // Attacher les events de tri
            document.querySelectorAll('th[data-col]').forEach(th => {
                th.addEventListener('click', () => {
                    const col = th.dataset.col;
                    if (col === 'driver') return;
                    if (triColonne === col) triAsc = !triAsc;
                    else { triColonne = col; triAsc = false; }
                    afficherTable();
                });
            });
        }

        async function charger() {
            try {
                const res = await fetch('/api/drivers/top');
                const data = await res.json();
                tousLesDrivers = data.drivers || [];

                const totalCourses = tousLesDrivers.reduce((s, d) => s + (d.courses || 0), 0);
                const totalVictoires = tousLesDrivers.reduce((s, d) => s + (d.victoires || 0), 0);
                const tauxMoyen = totalCourses > 0 ? ((totalVictoires / totalCourses) * 100).toFixed(1) : '0';

                document.getElementById('stat-total').textContent = tousLesDrivers.length;
                document.getElementById('stat-courses').textContent = totalCourses;
                document.getElementById('stat-victoires').textContent = totalVictoires;
                document.getElementById('stat-taux').textContent = tauxMoyen + '%';

                afficherTable();
            } catch (e) {
                document.getElementById('table-container').innerHTML = '<div class="empty">Erreur de chargement</div>';
            }
        }

        document.getElementById('search-input').addEventListener('input', afficherTable);

        charger();
    </script>
</body>
</html>
